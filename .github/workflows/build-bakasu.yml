name: Build BakaSU + SUSFS Kernel (earth)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "LineageOS kernel branch/tag"
        required: true
        default: "lineage-24.0"
      bakasu_ref:
        description: "BakaSU branch/tag/commit (pinned for this patch set)"
        required: true
        default: "516d3e87fbc986ccefdde2c2765f1700612441a9"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: bakasu
      KBUILD_BUILD_HOST: github-actions
      MAKE_ARGS: "O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu-"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_earth
          ref: ${{ github.event.inputs.kernel_ref || 'lineage-24.0' }}
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 lld-17 llvm-17 gcc-aarch64-linux-gnu \
            bc flex bison make libssl-dev libelf-dev libyaml-dev \
            device-tree-compiler zip unzip python3 git curl cpio

      - name: Integrate BakaSU + SUSFS
        working-directory: kernel
        run: |
          set -euo pipefail

          BAKASU_REF="${{ github.event.inputs.bakasu_ref || '516d3e87fbc986ccefdde2c2765f1700612441a9' }}"

          # BakaSU setup: clone driver, symlink drivers/kernelsu, update
          # drivers/Makefile and drivers/Kconfig.
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${BAKASU_REF}/kernel/setup.sh" \
            | bash -s "$BAKASU_REF"

          # SUSFS v2.3.0 core backport for Linux 4.19, plus the SUSFS
          # inline-hook integration required by BakaSU.
          git apply --whitespace=nowarn ../patches/bakasu-susfs-earth-4.19.patch

          # Fix build warnings from the upstream earth tree (duplicate
          # defconfig symbols, unmet Kconfig dependencies, unused
          # variables/functions, macro redefinitions, DTC reg_format /
          # gpios / interrupts warnings, oversized stack frames in the
          # touchscreen selftest paths, and MTK Makefile debug prints).
          git apply --whitespace=nowarn ../patches/fix-build-warnings.patch

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-17/bin:$PATH"

          make $MAKE_ARGS earth_defconfig

          # The BakaSU/SUSFS options are applied here instead of inside the
          # source patch, so the patch does not depend on the exact tail of
          # earth_defconfig (LineageOS 24.0 changed it).
          # KSU_SUSFS lives inside the "KernelSU Hooking Method" choice
          # (default: KSU_TRACEPOINT_HOOK). Enabling it without first
          # disabling the other choice members makes kconfig warn with
          # "override: KSU_SUSFS changes choice state", so disable them
          # explicitly first.
          ./scripts/config --file out/.config \
            -d KSU_TRACEPOINT_HOOK \
            -d KSU_MANUAL_HOOK \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -e KALLSYMS \
            -e KALLSYMS_ALL

          make $MAKE_ARGS olddefconfig

          # Fail early if the BakaSU/SUSFS Kconfig settings were not picked up.
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config

          echo "BakaSU + SUSFS configuration:"
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KALLSYMS_ALL|CONFIG_THREAD_INFO_IN_TASK)' out/.config | sort

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-17/bin:$PATH"

          # Some LineageOS trees ship a prebuilt tools/build/cpio for the
          # builder's architecture. Use the host cpio from apt instead.
          # LineageOS 24.0 no longer ships this file, so only replace it
          # when it exists.
          if [ -e tools/build/cpio ]; then
            cp /usr/bin/cpio tools/build/cpio
            chmod +x tools/build/cpio
          fi

          make -j"$(nproc)" $MAKE_ARGS Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp anykernel/anykernel.sh AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "../BakaSU-SUSFS-Earth-${GITHUB_RUN_NUMBER}.zip" . \
            -x '*.git*' 'README.md'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-SUSFS-Earth-${{ github.run_number }}
          path: BakaSU-SUSFS-Earth-${{ github.run_number }}.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BakaSU + SUSFS Earth ${{ github.ref_name }}
          files: BakaSU-SUSFS-Earth-${{ github.run_number }}.zip
          generate_release_notes: true
