name: Build Xiaomi Earth Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 lld-17 llvm-17 gcc-aarch64-linux-gnu \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git libncurses5-dev libssl-dev lz4 python3 rsync schedtool squashfs-tools \
            xsltproc zlib1g-dev libelf-dev libarchive-tools wget zip

      - name: Clone Target Repository & Submodules
        run: |
          # Clone repository target beserta submodule-nya
          git clone --recursive -b lineage-23.2 https://github.com/mubashardev/android_kernel_xiaomi_earth_lineageos.git kernel
          cd kernel
          git submodule update --init --recursive

      - name: Run Build Script
        working-directory: ./kernel
        run: |
          # Memberikan izin eksekusi pada build.sh jika belum ada
          chmod +x build.sh
          
          # Menjalankan build varian KernelSU-Next dengan SUSFS
          ./build.sh ksu-next+susfs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-ksu-next-susfs
          path: kernel/releases/*.zip
