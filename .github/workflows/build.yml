name: Build Xiaomi Earth Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Up Disk Space Aggressively
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -a --volumes -f || true
          df -h

      - name: Install Build Dependencies & LLVM Repository
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg software-properties-common lsb-release

          # Tambahkan repository resmi LLVM untuk Ubuntu 22.04
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"

          sudo apt-get update
          sudo apt-get install -y \
            clang-17 lld-17 llvm-17 gcc-aarch64-linux-gnu \
            bc bison build-essential ccache curl flex \
            git libncurses5-dev libssl-dev lz4 python3 rsync schedtool squashfs-tools \
            xsltproc zlib1g-dev libelf-dev libarchive-tools wget zip python-is-python3

      - name: Clone Target Repository & Fix Submodules
        run: |
          # 1. Clone repo utama tanpa submodule otomatis dulu
          git clone -b lineage-23.2 https://github.com/mubashardev/android_kernel_xiaomi_earth_lineageos.git kernel
          cd kernel

          # 2. Inisialisasi submodule secara manual dengan sinkronisasi branch terbaru untuk menghindari error commit hilang
          git submodule init
          git submodule foreach --recursive 'git fetch --all || true'
          
          # Perbarui submodule dengan aman
          git submodule update --init --recursive --remote || {
            echo "Retrying submodule update with force..."
            git submodule update --init --recursive --force
          }

      - name: Run Build Script (KSU-Next + SUSFS)
        working-directory: ./kernel
        run: |
          chmod +x build.sh
          # Menjalankan opsi build khusus KSU-Next dengan SUSFS
          ./build.sh ksu-next+susfs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-ksu-next-susfs
          path: kernel/releases/*.zip
