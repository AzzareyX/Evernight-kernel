name: Build Xiaomi Earth Kernel

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Pilih varian yang ingin dibuild'
        required: true
        default: 'ksu-next+susfs'
        type: choice
        options:
          - vanilla
          - ksu-next
          - sukisu
          - ksu-next+susfs
          - sukisu-ultra+susfs
          - all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu-next+susfs]

    steps:
      - name: Free Up Disk Space Aggressively
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -a --volumes -f || true
          df -h

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg software-properties-common lsb-release

          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-17 lld-17 llvm-17 \
            gcc-aarch64-linux-gnu \
            bc flex bison make libssl-dev libelf-dev libyaml-dev \
            zip unzip python3 git rsync python-is-python3

          echo "Clang: $(/usr/lib/llvm-17/bin/clang --version | head -1)"
          echo "Cross: $(aarch64-linux-gnu-gcc --version | head -1)"

      - name: Clone Target Kernel Source
        run: |
          # Clone tanpa --recursive dulu agar kita bisa kontrol submodules secara manual
          git clone -b lineage-23.2 https://github.com/mubashardev/android_kernel_xiaomi_earth_lineageos.git kernel

      - name: Fix and Update Submodules Safely
        working-directory: ./kernel
        run: |
          echo "Initializing submodules..."
          git submodule init

          echo "Updating AnyKernel3 and other submodules to latest remote HEAD..."
          # Menggunakan --remote dan --force untuk menghindari error ref yang hilang
          git submodule update --init --recursive --remote --force || {
            echo "Fallback: resetting submodules..."
            git submodule foreach --recursive 'git fetch origin && git reset --hard origin/HEAD || true'
          }

      - name: Compute version string
        id: version
        working-directory: ./kernel
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y.%m.%d)"
          VERSION="v${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build kernel (${{ matrix.variant }})
        working-directory: ./kernel
        run: ./build.sh ${{ matrix.variant }}
        env:
          KERNEL_VERSION: ${{ steps.version.outputs.version }}

      - name: Rename zip with version
        working-directory: ./kernel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="${{ steps.version.outputs.date }}"
          VARIANT="${{ matrix.variant }}"
          OLD="releases/kernel-earth-${VARIANT}-${DATE}.zip"
          NEW="releases/kernel-earth-${VARIANT}-${VERSION}.zip"
          if [[ -f "$OLD" ]]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $NEW"
          else
            echo "::error::Expected zip not found: $OLD"
            ls releases/ || true
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: kernel/releases/kernel-earth-${{ matrix.variant }}-*.zip
          retention-days: 7
          if-no-files-found: error
