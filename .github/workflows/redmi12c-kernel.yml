name: Build Redmi 12C Kernel 4.19 (ReSukiSU + SusFS + Inline Hook)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git ccache automake lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib libxml2-utils lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            xsltproc unzip bc rsync imagemagick libtool libelf-dev xz-utils \
            schedtool squashfs-tools pngquant ncftp make pkg-config lib32ncurses5-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/mt6768-dev/android_kernel_xiaomi_earth -b lineage-23.2 kernel
          cd kernel

      - name: Integrate ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Fetch and Apply SusFS & Inline Hook Patches (Kernel 4.19)
        run: |
          cd kernel

          # Kloning repositori patch milik JackA1ltman
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git -b mainline patches_repo

          # 1. Jalankan skrip inline hook
          if [ -f "patches_repo/Patches/Patch/inline_hook.sh" ]; then
            cp patches_repo/Patches/Patch/inline_hook.sh ./inline_hook.sh
            chmod +x inline_hook.sh
            ./inline_hook.sh
          fi

          # 2. Terapkan SusFS patch khusus untuk Kernel 4.19
          PATCH_419_DIR="patches_repo/Patches/4.19"
          if [ -d "$PATCH_419_DIR" ]; then
            for patch_file in "$PATCH_419_DIR"/*.patch; do
              if [ -f "$patch_file" ]; then
                echo "Applying 4.19 patch: $patch_file"
                git apply "$patch_file" || patch -p1 < "$patch_file" || true
              fi
            done
          else
            echo "Direktori patch 4.19 tidak ditemukan, mencoba patch umum..."
            for patch_file in patches_repo/Patches/*.patch; do
              if [ -f "$patch_file" ]; then
                echo "Applying patch: $patch_file"
                git apply "$patch_file" || patch -p1 < "$patch_file" || true
              fi
            done
          fi

          # Bersihkan file sementara
          rm -rf patches_repo inline_hook.sh

      - name: Setup Toolchain & Build Kernel
        run: |
          cd kernel
          
          # Clone Toolchain AArch64 GCC 4.9 (Standar untuk Kernel 4.19 MediaTek)
          git clone --depth=1 https://github.com/chenxiaolong/Toolchain-AArch64-GNU aarch64-linux-android-4.9
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$PWD/aarch64-linux-android-4.9/bin/aarch64-linux-gnu-
          export PATH="$PWD/aarch64-linux-android-4.9/bin:$PATH"
          
          # Generate defconfig untuk Redmi 12C (earth)
          make mtk_earth_defconfig
          
          # Kompilasi kernel
          make -j$(nproc) Image.gz-dtb dtbo.img

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-12C-Kernel-4.19-ReSukiSU-SusFS
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            kernel/arch/arm64/boot/dtbo.img
