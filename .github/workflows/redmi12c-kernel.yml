name: Redmi 12C - CIP Ancestry and Patch Audit (No Build)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Redmi 12C kernel branch to audit'
        required: true
        default: 'lineage-23.2'
        type: string
      cip_base_ref:
        description: 'CIP baseline tag'
        required: true
        default: 'v4.19.325-cip134'
        type: string
      cip_target_ref:
        description: 'CIP target tag (latest verified for this audit)'
        required: true
        default: 'v4.19.325-cip136'
        type: string
      source_since:
        description: 'Earliest committer date for source patch-id comparison (YYYY-MM-DD)'
        required: true
        default: '2026-04-01'
        type: string
      source_commit_limit:
        description: 'Maximum recent non-merge source commits to inspect'
        required: true
        default: '8000'
        type: string

permissions:
  contents: read

concurrency:
  group: cip-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ancestry-and-patch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install minimal audit tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git python3 ca-certificates
          git --version
          python3 --version

      - name: Clone kernel history without checking out files
        id: source
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          SOURCE_COMMIT_LIMIT: ${{ inputs.source_commit_limit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          git clone --filter=blob:none --no-checkout --single-branch \
            --branch "$KERNEL_BRANCH" --depth="$SOURCE_COMMIT_LIMIT" \
            https://github.com/mt6768-dev/android_kernel_xiaomi_earth.git kernel
          git -C kernel rev-parse HEAD | tee reports/source-head.txt
          git -C kernel log -1 --format='source_subject=%s%nsource_commit_date=%cI%nsource_author_date=%aI' \
            | tee reports/source-head-metadata.txt
          {
            echo '# Redmi 12C CIP ancestry and patch audit'
            echo
            echo '- Mode: read-only audit; no patches applied, no root solution installed, no kernel build, no flashable ZIP.'
            echo "- Source: mt6768-dev/android_kernel_xiaomi_earth@${KERNEL_BRANCH}"
            echo "- Source HEAD: $(git -C kernel rev-parse HEAD)"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > reports/audit.md

      - name: Fetch official CIP baseline and target
        id: cip
        env:
          CIP_BASE_REF: ${{ inputs.cip_base_ref }}
          CIP_TARGET_REF: ${{ inputs.cip_target_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C kernel remote add cip https://kernel.googlesource.com/pub/scm/linux/kernel/git/cip/linux-cip
          git -C kernel fetch --filter=blob:none --no-tags cip \
            "refs/tags/${CIP_BASE_REF}:refs/tags/${CIP_BASE_REF}" \
            "refs/tags/${CIP_TARGET_REF}:refs/tags/${CIP_TARGET_REF}"
          BASE_SHA="$(git -C kernel rev-parse "refs/tags/${CIP_BASE_REF}^{commit}")"
          TARGET_SHA="$(git -C kernel rev-parse "refs/tags/${CIP_TARGET_REF}^{commit}")"
          printf '%s\n' "$BASE_SHA" > reports/cip-base-sha.txt
          printf '%s\n' "$TARGET_SHA" > reports/cip-target-sha.txt
          {
            echo '## CIP refs'
            echo
            echo "- Baseline: \\`${CIP_BASE_REF}\\` → \\`${BASE_SHA}\\`"
            echo "- Target: \\`${CIP_TARGET_REF}\\` → \\`${TARGET_SHA}\\`"
          } | tee -a reports/audit.md
          if ! git -C kernel merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"; then
            echo 'FAIL: baseline is not an ancestor of target; cannot compute a safe release delta.' | tee -a reports/audit.md
            echo 'cip_refs_ok=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git -C kernel rev-list "$BASE_SHA..$TARGET_SHA" > reports/cip-delta-commits.txt
          git -C kernel rev-list --count "$BASE_SHA..$TARGET_SHA" | tee reports/cip-delta-count.txt
          echo 'cip_refs_ok=true' >> "$GITHUB_OUTPUT"

      - name: Compare ancestry and stable patch IDs
        id: audit
        if: steps.cip.outputs.cip_refs_ok == 'true'
        env:
          CIP_BASE_REF: ${{ inputs.cip_base_ref }}
          CIP_TARGET_REF: ${{ inputs.cip_target_ref }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          SOURCE_SINCE: ${{ inputs.source_since }}
          SOURCE_COMMIT_LIMIT: ${{ inputs.source_commit_limit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          from collections import defaultdict

          root = pathlib.Path.cwd()
          reports = root / 'reports'
          repo = root / 'kernel'
          since = os.environ['SOURCE_SINCE']
          until = '2026-10-20'
          limit = int(os.environ['SOURCE_COMMIT_LIMIT'])
          base_ref = os.environ['CIP_BASE_REF']
          target_ref = os.environ['CIP_TARGET_REF']

          def git(*args, check=True):
              p = subprocess.run(['git', '-C', str(repo), *args], text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode:
                  raise RuntimeError(f"git {' '.join(args)} failed: {p.stderr[-3000:]}")
              return p

          head = git('rev-parse', 'HEAD').stdout.strip()
          base = git('rev-parse', f'refs/tags/{base_ref}^{{commit}}').stdout.strip()
          target = git('rev-parse', f'refs/tags/{target_ref}^{{commit}}').stdout.strip()
          exact_ancestor = git('merge-base', '--is-ancestor', base, 'HEAD', check=False).returncode == 0
          merge_base = git('merge-base', base, 'HEAD', check=False).stdout.strip()
          if not merge_base:
              merge_base = 'none (unrelated histories or shallow boundary)'

          # Enumerate the complete DAG delta, including commits brought in through merges.
          cip_commits = git('rev-list', '--reverse', f'{base}..{target}').stdout.splitlines()
          cip_rows = []
          cip_ids = defaultdict(list)
          for sha in cip_commits:
              parents = git('rev-list', '--parents', '-n', '1', sha).stdout.split()
              subject = git('show', '-s', '--format=%s', sha).stdout.strip()
              if len(parents) > 2:
                  cip_rows.append({'sha': sha, 'subject': subject, 'kind': 'merge', 'patch_id': None})
                  continue
              # First-parent diff for normal commits. Root commits are not expected in a release delta.
              patch = git('show', '--format=', '--no-ext-diff', '--binary', '--no-renames', sha, check=False)
              if patch.returncode or not patch.stdout.strip():
                  cip_rows.append({'sha': sha, 'subject': subject, 'kind': 'empty-or-unavailable-diff', 'patch_id': None})
                  continue
              pid_out = subprocess.run(['git', 'patch-id', '--stable'], input=patch.stdout, text=True,
                                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              pid = pid_out.stdout.split()[0] if pid_out.stdout.split() else None
              if pid:
                  cip_ids[pid].append(sha)
              cip_rows.append({'sha': sha, 'subject': subject, 'kind': 'commit', 'patch_id': pid})

          # Compare against recent source commits, including merge commits excluded from patch-id matching.
          # The bounded window prevents an unbounded scan; the report states its coverage explicitly.
          src_shas = git('log', '--no-merges', f'--since={since}', f'--until={until}',
                         f'-n{limit}', '--format=%H', 'HEAD').stdout.splitlines()
          source_patch_matches = defaultdict(list)
          source_rows = []
          for idx, sha in enumerate(src_shas, 1):
              patch = git('show', '--format=', '--no-ext-diff', '--binary', '--no-renames', sha, check=False)
              if patch.returncode or not patch.stdout.strip():
                  continue
              pid_out = subprocess.run(['git', 'patch-id', '--stable'], input=patch.stdout, text=True,
                                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              tokens = pid_out.stdout.split()
              if tokens:
                  pid = tokens[0]
                  source_patch_matches[pid].append(sha)
              if idx % 500 == 0:
                  print(f'Processed {idx}/{len(src_shas)} source commits for patch IDs', flush=True)

          matched = []
          unmatched = []
          merge_or_empty = []
          for row in cip_rows:
              pid = row['patch_id']
              if not pid:
                  merge_or_empty.append(row)
              elif pid in source_patch_matches:
                  row['source_match_commits'] = source_patch_matches[pid]
                  matched.append(row)
              else:
                  unmatched.append(row)

          # Source history graph can be shallow. Do not claim a definitive ancestry failure if the
          # common point is outside fetched history; report exact source/CIP relationship separately.
          source_shallow = (repo / '.git' / 'shallow').exists()
          result = {
              'source_repo': 'mt6768-dev/android_kernel_xiaomi_earth',
              'source_branch': os.environ.get('KERNEL_BRANCH', 'lineage-23.2'),
              'source_head': head,
              'source_shallow_clone': source_shallow,
              'source_history_window': {'since_committer_date': since, 'until_committer_date_exclusive': until,
                                        'max_non_merge_commits': limit, 'commits_scanned': len(src_shas)},
              'cip_baseline': {'ref': base_ref, 'sha': base},
              'cip_target': {'ref': target_ref, 'sha': target},
              'cip_baseline_is_ancestor_of_target': git('merge-base', '--is-ancestor', base, target, check=False).returncode == 0,
              'cip_baseline_exact_sha_is_ancestor_of_source_head': exact_ancestor,
              'source_cip_merge_base': merge_base,
              'cip_delta_commit_count_including_merges': len(cip_commits),
              'cip_nonmerge_patch_count': sum(1 for x in cip_rows if x['patch_id']),
              'cip_patch_ids_exactly_matched_in_source_window': len(matched),
              'cip_patch_ids_not_found_in_source_window': len(unmatched),
              'cip_merges_empty_or_unavailable_diffs': len(merge_or_empty),
              'matched': matched,
              'unmatched': unmatched,
              'merge_or_empty': merge_or_empty,
              'interpretation': 'Exact stable patch-id matches are evidence of matching changes in the scanned source history, not proof the final tree still contains them. No match is not proof the patch is absent: it may be edited, squashed, outside the date/commit window, or hidden by shallow history. This audit does not apply patches or build a kernel.'
          }
          (reports / 'cip-patch-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          with (reports / 'cip-patch-audit.csv').open('w') as f:
              f.write('status,cip_sha,patch_id,subject,source_match_commits\n')
              for row in cip_rows:
                  status = 'merge-or-empty' if not row.get('patch_id') else ('exact-match' if row.get('source_match_commits') else 'no-exact-match')
                  matches = ';'.join(row.get('source_match_commits', []))
                  safe_subject = row['subject'].replace('"', '""')
                  f.write(f'{status},{row["sha"]},{row.get("patch_id") or ""},"{safe_subject}","{matches}"\n')

          with (reports / 'audit.md').open('a') as f:
              f.write('\n## Ancestry result\n\n')
              f.write(f'- Source HEAD: `{head}`\n')
              f.write(f'- CIP baseline exact SHA ancestor of source HEAD: **{exact_ancestor}**\n')
              f.write(f'- Source/CIP merge-base: `{merge_base}`\n')
              f.write(f'- Source clone shallow: **{source_shallow}**\n')
              f.write('\nA false exact-ancestor result is not itself a failure: the device tree may contain equivalent CIP changes via different commits.\n')
              f.write('\n## Stable patch-ID comparison\n\n')
              f.write(f'- CIP DAG delta commits (including merges): {len(cip_commits)}\n')
              f.write(f'- CIP non-merge commits with patch IDs: {result["cip_nonmerge_patch_count"]}\n')
              f.write(f'- Exact patch-ID matches in source window: {len(matched)}\n')
              f.write(f'- CIP patch IDs without exact match in source window: {len(unmatched)}\n')
              f.write(f'- Merge/empty/unavailable diffs requiring separate inspection: {len(merge_or_empty)}\n')
              f.write(f'- Source non-merge commits scanned: {len(src_shas)} (committer dates {since} through {until}, exclusive)\n')
              f.write('\n### Exact matches\n\n')
              if matched:
                  for row in matched:
                      f.write(f'- CIP `{row["sha"][:12]}` ↔ source `{", ".join(x[:12] for x in row.get("source_match_commits", []))}` — {row["subject"]}\n')
              else:
                  f.write('- No exact stable patch-ID matches found in the scanned source window.\n')
              f.write('\n### No exact match in scanned window (not proof of absence)\n\n')
              for row in unmatched[:200]:
                  f.write(f'- `{row["sha"][:12]}` — {row["subject"]}\n')
              if len(unmatched) > 200:
                  f.write(f'- ... plus {len(unmatched)-200} additional entries in `cip-patch-audit.csv`.\n')
              f.write('\n## Safety decision\n\n')
              f.write('**AUDIT ONLY. No CIP commits were applied. No BakaSU/SUSFS/inline-hook scripts were run. No kernel was built.**\n')
              f.write('Use this report to plan a reviewed port. Do not automatically cherry-pick all unmatched commits: merge commits, context-dependent changes, and downstream modifications require manual review.\n')
          print(f"Audit complete: {len(matched)} exact matches; {len(unmatched)} unmatched patch IDs; {len(merge_or_empty)} merge/empty diffs.")
          PY

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi12c-cip-ancestry-patch-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 30
